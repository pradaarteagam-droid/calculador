<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Simple Calculator</title><link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="calculator" aria-label="Calculator">
    <h1>Simple Calculator</h1>
    <output id="display" aria-live="polite">0</output>
    <div class="keys">
      <button class="wide muted" data-action="clear">AC</button><button class="muted" data-action="delete">DEL</button><button class="operator" data-value="/">÷</button>
      <button data-value="7">7</button><button data-value="8">8</button><button data-value="9">9</button><button class="operator" data-value="*">×</button>
      <button data-value="4">4</button><button data-value="5">5</button><button data-value="6">6</button><button class="operator" data-value="-">−</button>
      <button data-value="1">1</button><button data-value="2">2</button><button data-value="3">3</button><button class="operator" data-value="+">+</button>
      <button class="wide" data-value="0">0</button><button data-value=".">.</button><button class="equal" data-action="equals">=</button>
    </div>
    <p>Built with HTML, CSS and JavaScript.</p>
  </main><script src="script.js"></script>
</body></html>
